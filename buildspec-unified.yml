version: 0.2

env:
  shell: bash
  variables:
    # ---- Control knobs (override from GitHub Actions) ----
    MODE: "dispatch"            # build | test_one | dispatch
    SUITE: "pr"                 # suite selector used by dispatch (e.g., pr|postmerge|release)
    BRANCH_FILTER: ""           # optional; branch filter for test selection (main|neuron-staging)
    TEST_ID: ""                  # required when MODE=test_one
    IMAGE_TAG: ""                # defaults to $CODEBUILD_RESOLVED_SOURCE_VERSION when empty
    GIT_COMMIT: ""               # optional; default = IMAGE_TAG
    KAIZEN_ARTIFACTS_S3_PREFIX: ""  # optional: s3://bucket/prefix/ to upload raw kaizen logs
    KAIZEN_POLL_SECS: "120" 

phases:
  install:
    commands:
      - |
        set -euo pipefail
        echo "▶ Install base tools"
        yum install -y jq tar gzip git python3 python3-pip java-17-amazon-corretto-devel
        python3 --version; java -version
        pip3 install --no-cache-dir pyyaml

  pre_build:
    commands:
      - |
        set -euo pipefail
        IMAGE_TAG="${IMAGE_TAG:-$CODEBUILD_RESOLVED_SOURCE_VERSION}"
        GIT_COMMIT="${GIT_COMMIT:-$IMAGE_TAG}"
        echo "Using MODE=$MODE SUITE=$SUITE"
        echo "Using IMAGE_TAG=$IMAGE_TAG (plugin commit=$GIT_COMMIT)"
        # Note: vLLM version now controlled via requirements/core.txt
        # Cache optimization: BuildKit enabled for faster subsequent builds

        for v in GITHUB_TOKEN GITHUB_REPO ECR_REGISTRY ALPHA_REPO CICD_REPO AWS_REGION; do
          if [[ -z "${!v:-}" ]]; then echo "ERROR: $v not provided" >&2; exit 1; fi
        done

        # Install crane for reading image labels (needed for smart rebuild)
        echo "▶ Installing crane for image inspection"
        CRANE_VERSION="0.20.0"
        curl -sL "https://github.com/google/go-containerregistry/releases/download/v${CRANE_VERSION}/go-containerregistry_Linux_x86_64.tar.gz" \
          | tar -xz -C /tmp crane
        chmod +x /tmp/crane
        export PATH="/tmp:$PATH"
        crane version || echo "⚠️ Crane installation failed - smart rebuild will be skipped"

        echo "▶ Cloning plugin repository: https://github.com/${GITHUB_REPO}.git @ ${GIT_COMMIT}"
        mkdir -p /tmp/src && cd /tmp/src
        git init -q
        git config --global url."https://oauth2:${GITHUB_TOKEN}@github.com/".insteadOf "https://github.com/"
        git remote add origin "https://github.com/${GITHUB_REPO}.git"
        if ! git -c protocol.version=2 fetch --no-tags --depth=1 origin "${GIT_COMMIT}"; then
          git -c protocol.version=2 fetch --no-tags origin "${GIT_COMMIT}"
        fi
        git checkout --detach "${GIT_COMMIT}"
        if [[ -f .gitmodules ]]; then
          git -c protocol.version=2 submodule update --init --depth=1
        fi
        git config --global --unset-all url."https://oauth2:${GITHUB_TOKEN}@github.com/".insteadOf || true
        unset GITHUB_TOKEN
        echo "✅ Plugin source checked out at $(git rev-parse --short HEAD)"
        ls -la /tmp/src

        echo "▶ Login to ECR: $ECR_REGISTRY"
        aws ecr get-login-password --region "$AWS_REGION" | docker login -u AWS --password-stdin "$ECR_REGISTRY"

        if [[ -z "${BASE_IMAGE:-}" ]]; then
          # Determine which ECR repo to use based on branch name
          ECR_RELEASE_REPO="neuron-release"  # Release ECR repository
          
          # Check if we're on a release branch
          # Try CodeBuild variables first, then TARGET_BRANCH from GitHub Actions
          BRANCH_NAME="${CODEBUILD_WEBHOOK_HEAD_REF:-${CODEBUILD_SOURCE_VERSION:-${TARGET_BRANCH:-}}}"
          
          if [[ -z "$BRANCH_NAME" ]]; then
            echo "⚠️ Warning: Could not determine branch, using default alpha repository"
            REPO_TO_USE="$ALPHA_REPO"
          elif [[ "$BRANCH_NAME" =~ refs/heads/(neuron-release.*) ]] || [[ "$BRANCH_NAME" =~ ^neuron-release.* ]]; then
            echo "▶ Detected release branch: $BRANCH_NAME"
            echo "▶ Resolving BASE_IMAGE digest from $ECR_RELEASE_REPO (release repository)"
            REPO_TO_USE="$ECR_RELEASE_REPO"
          else
            echo "▶ Branch: $BRANCH_NAME"
            echo "▶ Using default alpha repository"
            echo "▶ Resolving BASE_IMAGE digest from $ALPHA_REPO"
            REPO_TO_USE="$ALPHA_REPO"
          fi

          # Use JSON output with jq for reliable parsing. AWS CLI --output text can return multiple lines
          # for array[0] queries, causing awk to select the wrong image digest.
          DIGEST=$(aws ecr describe-images \
            --repository-name "$REPO_TO_USE" \
            --region "$AWS_REGION" \
            --query "reverse(sort_by(imageDetails[?artifactMediaType!='application/vnd.buildkit.cacheconfig.v0' && imageManifestMediaType!=null], &imagePushedAt))[0].imageDigest" \
            --output json 2>/dev/null | tr -d '"' || echo "")
          # Handle null/empty/None responses
          if [[ -z "$DIGEST" || "$DIGEST" == "None" || "$DIGEST" == "null" ]]; then
            echo "ERROR: No suitable non-cache IMAGE artifacts found in $ALPHA_REPO" >&2 
            exit 1
          fi
          BASE_IMAGE="$ECR_REGISTRY/$REPO_TO_USE@$DIGEST"
          echo "✅ Resolved to digest: ${DIGEST:0:12}..."
        else
          echo "BASE_IMAGE override provided: $BASE_IMAGE"
        fi

        # Check vLLM version from requirements/core.txt
        echo "▶ Checking vLLM version from requirements/core.txt"
        VLLM_VERSION=$(grep -E '^vllm==' /tmp/src/requirements/core.txt | cut -d'=' -f3 || echo "not_found")
        echo "vLLM version in requirements/core.txt: $VLLM_VERSION"

        {
          echo "BASE_IMAGE=$BASE_IMAGE"
          echo "IMAGE_TAG=$IMAGE_TAG"
          echo "GIT_COMMIT=$GIT_COMMIT"
          echo "VLLM_VERSION=$VLLM_VERSION"
          echo "MODE=$MODE"
          echo "SUITE=$SUITE"
          echo "KAIZEN_POLL_SECS=${KAIZEN_POLL_SECS:-120}"
          echo "KAIZEN_ARTIFACTS_S3_PREFIX=${KAIZEN_ARTIFACTS_S3_PREFIX:-}"
        } | tee /tmp/build_env

  build:
    commands:
      - |
        set -euo pipefail
        source /tmp/build_env
        cd /tmp/src

        # Extract the digest of the current base image for tracking
        # This is used for smart rebuild detection
        echo "▶ Extracting base image digest for tracking"
        if [[ "$BASE_IMAGE" == *"@sha256:"* ]]; then
          # Already a digest reference
          CURRENT_BASE_DIGEST="${BASE_IMAGE#*@}"
        else
          # Tag reference - get the digest using crane (works for any registry including public ECR)
          if command -v crane &>/dev/null; then
            CURRENT_BASE_DIGEST=$(crane digest "$BASE_IMAGE" 2>/dev/null || echo "unknown")
          else
            echo "⚠️ Crane not available - cannot extract base image digest"
            CURRENT_BASE_DIGEST="unknown"
          fi
        fi
        echo "Current base image digest: ${CURRENT_BASE_DIGEST:0:20}..."
        echo "CURRENT_BASE_DIGEST=$CURRENT_BASE_DIGEST" >> /tmp/build_env

        # Check if image already exists in ECR (skip rebuild for re-runs)
        # Uses smart rebuild: checks if base image has changed since last build
        echo "▶ Checking if image already exists: $ECR_REGISTRY/$CICD_REPO:$IMAGE_TAG"
        IMAGE_EXISTS="false"
        NEEDS_REBUILD="false"
        BUILD_STATUS="unknown"
        BUILD_REASON="unknown"
        
        if [[ "${FORCE_REBUILD:-false}" == "true" ]]; then
          echo "▶ FORCE_REBUILD=true - will rebuild even if image exists"
          echo "SKIP_BUILD=false" >> /tmp/build_env
          BUILD_STATUS="built"
          BUILD_REASON="force rebuild"
        elif aws ecr describe-images \
            --repository-name "$CICD_REPO" \
            --region "$AWS_REGION" \
            --image-ids imageTag="$IMAGE_TAG" \
            --query 'imageDetails[0].imageDigest' \
            --output text 2>/dev/null | grep -q "^sha256:"; then
          IMAGE_EXISTS="true"
          echo "✅ Image exists in ECR - checking if base image changed (smart rebuild)"
          
          # Smart rebuild: check if the base image has changed since the image was built
          # This uses the vllm-neuron.base-image-digest label stored in the image
          EXISTING_BASE_DIGEST="unknown"
          if command -v crane &>/dev/null; then
            EXISTING_BASE_DIGEST=$(crane config "$ECR_REGISTRY/$CICD_REPO:$IMAGE_TAG" 2>/dev/null \
              | jq -r '.config.Labels["vllm-neuron.base-image-digest"] // "unknown"' 2>/dev/null \
              || echo "unknown")
            echo "Existing image's base digest: ${EXISTING_BASE_DIGEST:0:20}..."
          else
            echo "⚠️ Crane not available - skipping smart rebuild check"
          fi
          
          # Compare digests to determine if rebuild is needed
          if [[ "$EXISTING_BASE_DIGEST" == "unknown" || -z "$EXISTING_BASE_DIGEST" ]]; then
            echo "⚠️ Could not read base image label - reusing existing image"
            echo "   (This image was built before smart rebuild was implemented)"
            echo "SKIP_BUILD=true" >> /tmp/build_env
            BUILD_STATUS="reused"
            BUILD_REASON="legacy image (no base tracking)"
            {
              echo "**Docker Build:** Skipped (image exists, no base tracking)"
              echo "**Image Tag:** \`$IMAGE_TAG\`"
            } >> /tmp/build_metrics
          elif [[ "$EXISTING_BASE_DIGEST" != "$CURRENT_BASE_DIGEST" ]]; then
            NEEDS_REBUILD="true"
            echo "🔄 Base image changed! Triggering rebuild."
            echo "   Previous base: ${EXISTING_BASE_DIGEST:0:20}..."
            echo "   Current base:  ${CURRENT_BASE_DIGEST:0:20}..."
            echo "SKIP_BUILD=false" >> /tmp/build_env
            BUILD_STATUS="rebuilt"
            BUILD_REASON="base image changed"
            {
              echo "**Docker Build:** Rebuild (base image updated)"
              echo "**Previous Base:** \`${EXISTING_BASE_DIGEST:0:12}...\`"
              echo "**Current Base:** \`${CURRENT_BASE_DIGEST:0:12}...\`"
            } >> /tmp/build_metrics
          else
            echo "✅ Base image unchanged - reusing existing image"
            echo "SKIP_BUILD=true" >> /tmp/build_env
            BUILD_STATUS="reused"
            BUILD_REASON="base unchanged"
            {
              echo "**Docker Build:** Skipped (base image unchanged)"
              echo "**Image Tag:** \`$IMAGE_TAG\`"
              echo "**Base Digest:** \`${CURRENT_BASE_DIGEST:0:12}...\`"
            } >> /tmp/build_metrics
          fi
        else
          echo "▶ Image not found - proceeding with build"
          echo "SKIP_BUILD=false" >> /tmp/build_env
          BUILD_STATUS="built"
          BUILD_REASON="new image"
        fi
        
        # Save build status for later emission (quote values to handle spaces)
        echo "BUILD_STATUS='$BUILD_STATUS'" >> /tmp/build_env
        echo "BUILD_REASON='$BUILD_REASON'" >> /tmp/build_env
        
        # Update IMAGE_EXISTS based on whether we need to rebuild
        if [[ "$NEEDS_REBUILD" == "true" ]]; then
          IMAGE_EXISTS="false"
        fi

        # Only build if image doesn't exist
        if [[ "$IMAGE_EXISTS" == "false" ]]; then
          # Determine which Dockerfile to use
          if [[ -n "${VLLM_VERSION_OVERRIDE:-}" ]]; then
            echo "▶ Using vLLM version override: $VLLM_VERSION_OVERRIDE"
            VLLM_VERSION="$VLLM_VERSION_OVERRIDE"
          fi

          # Check if version (from override OR requirements) is RC
          if [[ "$VLLM_VERSION" =~ rc[0-9]+$ ]]; then
            echo "⚠️ RC version detected: $VLLM_VERSION"
            DOCKERFILE="Dockerfile.compat"
            VLLM_SOURCE_URL=""  # Let Docker decide
            
          elif [[ -n "${VLLM_VERSION_OVERRIDE:-}" ]]; then
            # Non-RC override - still use compat for version override
            echo "▶ Version override: $VLLM_VERSION"
            DOCKERFILE="Dockerfile.compat"
            VLLM_SOURCE_URL=""
          else
            # No override, stable version from requirements
            echo "✅ Standard build with $VLLM_VERSION"
            DOCKERFILE="Dockerfile.plugin"
            VLLM_SOURCE_URL=""
          fi

          # Enable BuildKit for advanced caching
          export DOCKER_BUILDKIT=1
          export BUILDKIT_PROGRESS=auto
          
          # Build with ECR cache backend
          CACHE_TAG="$ECR_REGISTRY/$CICD_REPO:cache-$(echo "$DOCKERFILE" | tr '.' '-')"
          
          echo "▶ Building with caching: $DOCKERFILE"
          echo "▶ Cache tag: $CACHE_TAG"
          
          BUILD_START=$(date +%s)
          
          docker build \
            --cache-from "$CACHE_TAG" \
            --build-arg BUILDKIT_INLINE_CACHE=1 \
            --build-arg BASE_IMAGE="$BASE_IMAGE" \
            --build-arg BASE_IMAGE_DIGEST="$CURRENT_BASE_DIGEST" \
            --build-arg PLUGIN_VERSION="0.0.0+${IMAGE_TAG:0:8}" \
            --build-arg VLLM_VERSION="$VLLM_VERSION" \
            --build-arg VLLM_SOURCE_URL="$VLLM_SOURCE_URL" \
            -f "$DOCKERFILE" \
            -t "$ECR_REGISTRY/$CICD_REPO:$IMAGE_TAG" \
            -t "$CACHE_TAG" \
            .
          
          BUILD_END=$(date +%s)
          BUILD_TIME=$((BUILD_END - BUILD_START))
          
          echo "✅ Image built with plugin + vLLM ${VLLM_VERSION} in ${BUILD_TIME}s"
          
          # Save DOCKERFILE for post_build push
          echo "DOCKERFILE=$DOCKERFILE" >> /tmp/build_env
          
          # Track build metrics
          {
            echo "**Docker Build Time:** ${BUILD_TIME}s"
            echo "**Dockerfile:** \`$DOCKERFILE\`"
            echo "**Cache Tag:** \`$CACHE_TAG\`"
            echo "**Base Image:** \`$BASE_IMAGE\`"
          } >> /tmp/build_metrics
        fi

  post_build:
    commands:
      - |
        set -euo pipefail
        source /tmp/build_env
        cd /tmp

        # Only push if we actually built (not skipped)
        if [[ "${SKIP_BUILD:-false}" != "true" ]]; then
          echo "▶ Pushing image and cache to ECR"
          
          # Push main image
          docker push "$ECR_REGISTRY/$CICD_REPO:$IMAGE_TAG"
          
          # Push cache image (for future builds)
          if [[ -n "${DOCKERFILE:-}" ]]; then
            CACHE_TAG="$ECR_REGISTRY/$CICD_REPO:cache-$(echo "$DOCKERFILE" | tr '.' '-')"
            docker push "$CACHE_TAG" || echo "⚠️ Cache push failed (non-critical)"
          fi
        else
          echo "▶ Skipping push - image already existed in ECR"
        fi
        
        # Add build metrics to summary (GitHub Actions only)
        if [[ -f /tmp/build_metrics && -n "${GITHUB_STEP_SUMMARY:-}" ]]; then
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Build Performance" >> $GITHUB_STEP_SUMMARY
          cat /tmp/build_metrics >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
        elif [[ -f /tmp/build_metrics ]]; then
          echo "## Build Performance"
          cat /tmp/build_metrics
        fi

        # Only run env snapshot for fresh builds (skip for re-runs to save time)
        if [[ "${SKIP_BUILD:-false}" != "true" ]]; then
          echo " ====================== || NEURON ENV SNAPSHOT || ============================"
          docker run --rm --entrypoint /bin/bash "$ECR_REGISTRY/$CICD_REPO:$IMAGE_TAG" -lc "
            echo '============================ Python & vLLM =================================';
            python3 -V || true;
            python3 -c \"import importlib.util as u; s=u.find_spec('vllm'); print('vLLM not installed' if s is None else 'vLLM ' + getattr(__import__('vllm'),'__version__','?'))\" || true;
            python3 -c \"import importlib.util as u; s=u.find_spec('vllm_neuron'); print('Plugin not installed' if s is None else 'vllm-neuron installed')\" || true;

            echo;
            echo '============================= PIP Packages ===============================';
            timeout 15s pip list | grep -E 'neuron|vllm|transformers|numpy' || true;

            echo;
            echo '======================== APT Packages =====================================';
            timeout 15s apt list --installed 2>/dev/null | grep -E 'neuron' || true;

            echo '===========================================================================';
          " || true
        else
          echo "▶ Skipping env snapshot - reusing existing image $IMAGE_TAG"
        fi

        # Emit build info for GitHub Actions workflow summary parsing
        # Format: NEURON_BUILD_INFO|image_tag|base_image|base_digest|status|reason
        echo "NEURON_BUILD_INFO|${IMAGE_TAG}|${BASE_IMAGE}|${CURRENT_BASE_DIGEST:-unknown}|${BUILD_STATUS:-unknown}|${BUILD_REASON:-unknown}"

        echo "▶ Setting up Kaizen CLI"
        if [[ -z "${KAIZEN_S3_PREFIX:-}" ]]; then
          echo "ERROR: KAIZEN_S3_PREFIX not set (expected s3://bucket/prefix/ path)" >&2
          exit 1
        fi

        LATEST_KAIZEN_TGZ="$(
          aws s3 ls "$KAIZEN_S3_PREFIX" \
            | awk '/\.tar\.gz$/ {print $1" "$2" "$4}' \
            | sort \
            | tail -1 \
            | awk '{print $3}'
        )"
        if [[ -z "${LATEST_KAIZEN_TGZ:-}" ]]; then
          echo "ERROR: No Kaizen *.tar.gz found under $KAIZEN_S3_PREFIX" >&2
          aws s3 ls "$KAIZEN_S3_PREFIX" || true
          exit 1
        fi

        aws s3 cp "${KAIZEN_S3_PREFIX%/}/$LATEST_KAIZEN_TGZ" /tmp/kaizen.tar.gz \
          --no-progress --only-show-errors
        tar -xzf /tmp/kaizen.tar.gz -C /tmp
        KAIZEN_BIN="$(find /tmp -maxdepth 3 -type f -name kaizen -perm -u+x | head -1 || true)"
        if [[ -z "${KAIZEN_BIN:-}" ]]; then
          echo "ERROR: kaizen binary not found after extract" >&2
          find /tmp -maxdepth 3 -type f | sed 's/^/  /'
          exit 1
        fi
        chmod +x "$KAIZEN_BIN"
        export PATH="$(dirname "$KAIZEN_BIN"):$PATH"

        JDK_DIR="$(find /tmp -maxdepth 3 -type d -name 'jdk-17*' | head -1 || true)"
        if [[ -n "${JDK_DIR:-}" ]]; then
          export JAVA_HOME="$JDK_DIR"
          export PATH="$JAVA_HOME/bin:$PATH"
        fi
        kaizen --version || true

        # Ensure no pre-assumed creds leak into the dispatcher (prevents role chaining).
        unset AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY AWS_SESSION_TOKEN || true

        echo "▶ MODE: $MODE"
        case "$MODE" in
          build)
            echo "Build-only complete."
            ;;

          test_one)
            # Decode TEST_ID from base64 if provided (handles special chars from workflow)
            if [[ -n "${TEST_ID_B64:-}" ]]; then
              TEST_ID=$(echo "$TEST_ID_B64" | base64 -d)
            fi
            if [[ -z "${TEST_ID:-}" ]]; then
              echo "ERROR: TEST_ID or TEST_ID_B64 must be set for MODE=test_one" >&2; exit 2; fi
            bash /tmp/src/ci/kaizen-run-one.sh \
              "$ECR_REGISTRY/$CICD_REPO:$IMAGE_TAG" \
              "$TEST_ID" \
              "${KAIZEN_ARTIFACTS_S3_PREFIX:-}"
            ;;

          dispatch)
            echo "▶ Dispatching tests for suite: $SUITE (all tests queued simultaneously, poll=${KAIZEN_POLL_SECS}s)"
            PYTHONUNBUFFERED=1 python3 -u /tmp/src/ci/dispatch.py
            ;;

          *)
            echo "ERROR: Unknown MODE=$MODE" >&2; exit 2;;
        esac

        echo "✅ Codebuild complete"

artifacts:
  files:
    - ci/**
    - /tmp/kaizen_output*.log
    - /tmp/test_result_*.txt

cache:
  paths: []
