[pytest]
# Isolate rootdir at vllm_neuron/kernels/ so pytest does NOT walk up to
# vllm_neuron/__init__.py (which imports the vllm package). These kernel
# tests are self-contained CPU-only smoke + correctness suites that only
# need numpy/torch; the parent vllm_neuron package machinery is orthogonal.
#
# Reproducer (from vllm_neuron/kernels/):
#   py -3 -m pytest -q
#
# Or run a single suite (already validated 253/253 pass+skip in the
# standalone Fleet A staging tree — see GREEN-BOARD-2026-08-28.md):
#   py -3 -m pytest -q tests/test_dsa_lightning_indexer_correctness.py
testpaths = tests
addopts = -q --import-mode=importlib
